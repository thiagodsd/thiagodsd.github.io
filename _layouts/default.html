<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8'>
  <!-- title -->
  <title>
      {% if page.title %}{{ page.title }}{% else %}{{ site.name }} &mdash; {{ site.description }}{% endif %}
  </title>

  <!-- meta description -->
  <meta name="description" content="{{ site.description }}">
  <!-- twitter card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ page.title }}">
  {% if page.description %}<meta name="twitter:description" content="{{ page.description }}">{% endif %}
  {% if page.img %}<meta property="og:image" content="{{site.url}}{{page.img}}">{% endif %}
  <!-- highlighter -->
  {% if site.highlighter %}<link rel='stylesheet' href='{{ site.url }}/assets/css/syntax.css' type='text/css'>{% endif %}
  <!-- responsiveness -->
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <!-- MathJax v3 - Modern LaTeX rendering -->
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        tags: 'ams',
        packages: {'[+]': ['ams', 'color']}
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
  {% include header.html %}

  {{ content }}

  <p style="text-align: center; font-size: small; color: #666; margin-top: 2em;">
    <i>orgulhosamente escrito sob a garoa cortante de são paulo, as copas melódicas de maringá e o sol escaldante de presidente prudente</i>
  </p>
</body>
</html>
