name: "zustandssumme"
description: " "

url: '' 
baseurl: ''

markdown: kramdown
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
highlighter: rouge

kramdown:
  use_math: true
  syntax_highlighter: rouge
  parse_block_html: true

timezone: Etc/UTC

plugins:
  - jekyll-paginate

paginate: 10
paginate_path: /page-:num

#disqus-id: your-disqus-id

source: .
destination: ./_site

sass:
    style: :compressed
    sass_dir: assets/css/

collections:
  isnebei:
    output: true